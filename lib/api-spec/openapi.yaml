openapi: 3.1.0
info:
  title: Spark API
  version: 0.2.0
  description: Spark commerce operating system API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Auth operations
  - name: ideas
    description: Idea generation and management
  - name: bundles
    description: Bundle generation and management
  - name: scripts
    description: Script generation and management
  - name: hooks
    description: Viral hook generation and management
  - name: brands
    description: Brand identity generation and management
  - name: assets
    description: Unified asset management
  - name: analytics
    description: Analytics and stats
  - name: campaigns
    description: Distribution campaigns

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ───────────────────────────────────
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      description: Returns the current authenticated user or a guest user object
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── IDEAS ──────────────────────────────────
  /spark/generate-ideas:
    post:
      operationId: generateIdeas
      tags: [ideas]
      summary: Generate product ideas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateIdeasBody"
      responses:
        "200":
          description: Generated product ideas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateIdeasResponse"

  /spark/saved-ideas:
    get:
      operationId: getSavedIdeas
      tags: [ideas]
      summary: List saved ideas
      parameters:
        - name: niche
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of saved ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedIdea"
    post:
      operationId: saveIdea
      tags: [ideas]
      summary: Save an idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveIdeaBody"
      responses:
        "201":
          description: Saved idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedIdea"

  /spark/saved-ideas/{id}:
    get:
      operationId: getSavedIdeaById
      tags: [ideas]
      summary: Get a saved idea by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedIdea"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSavedIdea
      tags: [ideas]
      summary: Delete a saved idea
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  # ─── BUNDLES ─────────────────────────────────
  /spark/generate-bundle:
    post:
      operationId: generateBundle
      tags: [bundles]
      summary: Generate offer bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateBundleBody"
      responses:
        "200":
          description: Generated offer bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateBundleResponse"

  /spark/saved-bundles:
    get:
      operationId: getSavedBundles
      tags: [bundles]
      summary: List saved bundles
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of saved bundles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedBundle"
    post:
      operationId: saveBundle
      tags: [bundles]
      summary: Save a bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveBundleBody"
      responses:
        "201":
          description: Saved bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBundle"

  /spark/saved-bundles/{id}:
    get:
      operationId: getSavedBundleById
      tags: [bundles]
      summary: Get a saved bundle by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBundle"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSavedBundle
      tags: [bundles]
      summary: Delete a saved bundle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  # ─── SCRIPTS ─────────────────────────────────
  /spark/generate-tiktok-script:
    post:
      operationId: generateTikTokScript
      tags: [scripts]
      summary: Generate TikTok scripts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTikTokScriptBody"
      responses:
        "200":
          description: Generated scripts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateTikTokScriptResponse"

  /spark/saved-scripts:
    get:
      operationId: getSavedScripts
      tags: [scripts]
      summary: List saved scripts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of saved scripts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedScript"
    post:
      operationId: saveScript
      tags: [scripts]
      summary: Save a script set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveScriptBody"
      responses:
        "201":
          description: Saved script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedScript"

  /spark/saved-scripts/{id}:
    delete:
      operationId: deleteSavedScript
      tags: [scripts]
      summary: Delete a saved script set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  # ─── HOOKS ───────────────────────────────────
  /spark/generate-viral-hooks:
    post:
      operationId: generateViralHooks
      tags: [hooks]
      summary: Generate viral hooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateViralHooksBody"
      responses:
        "200":
          description: Generated viral hooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateViralHooksResponse"

  /spark/saved-hooks:
    get:
      operationId: getSavedHooks
      tags: [hooks]
      summary: List saved hook sets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of saved hook sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedHook"
    post:
      operationId: saveHooks
      tags: [hooks]
      summary: Save a hook set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveHooksBody"
      responses:
        "201":
          description: Saved hook set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedHook"

  /spark/saved-hooks/{id}:
    delete:
      operationId: deleteSavedHook
      tags: [hooks]
      summary: Delete a saved hook set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  # ─── BRANDS ──────────────────────────────────
  /spark/generate-brand:
    post:
      operationId: generateBrand
      tags: [brands]
      summary: Generate brand identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateBrandBody"
      responses:
        "200":
          description: Generated brand identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateBrandResponse"

  /spark/saved-brands:
    get:
      operationId: getSavedBrands
      tags: [brands]
      summary: List saved brands
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of saved brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedBrand"
    post:
      operationId: saveBrand
      tags: [brands]
      summary: Save a brand identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveBrandBody"
      responses:
        "201":
          description: Saved brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBrand"

  /spark/saved-brands/{id}:
    delete:
      operationId: deleteSavedBrand
      tags: [brands]
      summary: Delete a saved brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  # ─── ASSETS ──────────────────────────────────
  /spark/assets:
    get:
      operationId: getAssets
      tags: [assets]
      summary: Get all assets summary
      description: Returns unified counts and recent items across all asset types
      responses:
        "200":
          description: Assets summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetsResponse"

  # ─── ANALYTICS ───────────────────────────────
  /spark/stats:
    get:
      operationId: getStats
      tags: [analytics]
      summary: Get dashboard stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /spark/analytics:
    get:
      operationId: getAnalytics
      tags: [analytics]
      summary: Get detailed analytics
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
            description: Number of days to look back
      responses:
        "200":
          description: Detailed analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"

  # ─── CAMPAIGNS ───────────────────────────────
  /spark/campaigns:
    get:
      operationId: getCampaigns
      tags: [campaigns]
      summary: List campaigns
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, published, paused]
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignBody"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /spark/campaigns/{id}:
    get:
      operationId: getCampaignById
      tags: [campaigns]
      summary: Get a campaign by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaignBody"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

components:
  schemas:

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required: [error]

    DeleteResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    # ─── AUTH ────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        plan:
          type: string
          enum: [free, pro]
        isGuest:
          type: boolean
      required: [id, plan, isGuest]

    # ─── IDEAS ───────────────────────────────
    GenerateIdeasBody:
      type: object
      properties:
        niche:
          type: string
        audience:
          type: string
        painPoint:
          type: string
        trendMode:
          type: boolean
          default: false
        count:
          type: integer
          default: 3
      required: [niche]

    ProductIdea:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        demandScore:
          type: integer
          minimum: 0
          maximum: 100
        competitionScore:
          type: integer
          minimum: 0
          maximum: 100
        profitPotential:
          type: string
        saturationLevel:
          type: string
          enum: [low, medium, high]
        targetAudience:
          type: string
        problemSolved:
          type: string
        whyItSells:
          type: string
      required: [title, description, demandScore, competitionScore, profitPotential, saturationLevel, targetAudience, problemSolved, whyItSells]

    GenerateIdeasResponse:
      type: object
      properties:
        ideas:
          type: array
          items:
            $ref: "#/components/schemas/ProductIdea"
        niche:
          type: string
      required: [ideas, niche]

    SaveIdeaBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        niche:
          type: string
        demandScore:
          type: integer
        competitionScore:
          type: integer
        profitPotential:
          type: string
        saturationLevel:
          type: string
        targetAudience:
          type: string
        problemSolved:
          type: string
        whyItSells:
          type: string
      required: [title, description, niche]

    SavedIdea:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        niche:
          type: string
        demandScore:
          type: integer
        competitionScore:
          type: integer
        profitPotential:
          type: string
        saturationLevel:
          type: string
        targetAudience:
          type: string
        problemSolved:
          type: string
        whyItSells:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, title, description, niche, createdAt]

    # ─── BUNDLES ─────────────────────────────
    GenerateBundleBody:
      type: object
      properties:
        productTitle:
          type: string
        productDescription:
          type: string
        targetAudience:
          type: string
        angle:
          type: string
          enum: [pain, desire, transformation]
          default: transformation
      required: [productTitle, productDescription, targetAudience]

    BundleItem:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
        value:
          type: string
      required: [name, type, description, value]

    GenerateBundleResponse:
      type: object
      properties:
        offerName:
          type: string
        headline:
          type: string
        subheadline:
          type: string
        coreProduct:
          type: string
        bonuses:
          type: array
          items:
            $ref: "#/components/schemas/BundleItem"
        price:
          type: string
        strikethroughPrice:
          type: string
        guarantee:
          type: string
        callToAction:
          type: string
        bullets:
          type: array
          items:
            type: string
      required: [offerName, headline, subheadline, coreProduct, bonuses, price, strikethroughPrice, guarantee, callToAction, bullets]

    SaveBundleBody:
      type: object
      properties:
        productTitle:
          type: string
        targetAudience:
          type: string
        angle:
          type: string
        offerName:
          type: string
        headline:
          type: string
        price:
          type: string
        strikethroughPrice:
          type: string
        data:
          type: object
          description: Full bundle JSON
      required: [productTitle, offerName, headline, data]

    SavedBundle:
      type: object
      properties:
        id:
          type: integer
        productTitle:
          type: string
        targetAudience:
          type: string
        angle:
          type: string
        offerName:
          type: string
        headline:
          type: string
        price:
          type: string
        strikethroughPrice:
          type: string
        data:
          type: object
        createdAt:
          type: string
          format: date-time
      required: [id, productTitle, offerName, headline, data, createdAt]

    # ─── SCRIPTS ─────────────────────────────
    GenerateTikTokScriptBody:
      type: object
      properties:
        productTitle:
          type: string
        productDescription:
          type: string
        targetAudience:
          type: string
        style:
          type: string
          enum: [educational, storytelling, shocking, transformation]
          default: transformation
      required: [productTitle, productDescription, targetAudience]

    TikTokScript:
      type: object
      properties:
        hook:
          type: string
        script:
          type: string
        hashtags:
          type: array
          items:
            type: string
        caption:
          type: string
        estimatedViralScore:
          type: integer
          minimum: 0
          maximum: 100
      required: [hook, script, hashtags, caption, estimatedViralScore]

    GenerateTikTokScriptResponse:
      type: object
      properties:
        scripts:
          type: array
          items:
            $ref: "#/components/schemas/TikTokScript"
        productTitle:
          type: string
      required: [scripts, productTitle]

    SaveScriptBody:
      type: object
      properties:
        productTitle:
          type: string
        style:
          type: string
        data:
          type: object
          description: Full scripts array JSON
      required: [productTitle, data]

    SavedScript:
      type: object
      properties:
        id:
          type: integer
        productTitle:
          type: string
        style:
          type: string
        data:
          type: object
        createdAt:
          type: string
          format: date-time
      required: [id, productTitle, data, createdAt]

    # ─── HOOKS ───────────────────────────────
    GenerateViralHooksBody:
      type: object
      properties:
        productTitle:
          type: string
        description:
          type: string
        hookType:
          type: string
          enum: [curiosity, pain, story, short, all]
          default: all
        count:
          type: integer
          default: 5
      required: [productTitle]

    ViralHook:
      type: object
      properties:
        text:
          type: string
        type:
          type: string
        angle:
          type: string
      required: [text, type, angle]

    GenerateViralHooksResponse:
      type: object
      properties:
        hooks:
          type: array
          items:
            $ref: "#/components/schemas/ViralHook"
        productTitle:
          type: string
      required: [hooks, productTitle]

    SaveHooksBody:
      type: object
      properties:
        productTitle:
          type: string
        hookType:
          type: string
        data:
          type: object
          description: Full hooks array JSON
      required: [productTitle, data]

    SavedHook:
      type: object
      properties:
        id:
          type: integer
        productTitle:
          type: string
        hookType:
          type: string
        data:
          type: object
        createdAt:
          type: string
          format: date-time
      required: [id, productTitle, data, createdAt]

    # ─── BRANDS ──────────────────────────────
    GenerateBrandBody:
      type: object
      properties:
        niche:
          type: string
        productConcept:
          type: string
        targetAudience:
          type: string
        tonePreference:
          type: string
          enum: [bold, friendly, premium, playful, professional]
          default: bold
      required: [niche, productConcept]

    BrandColor:
      type: object
      properties:
        name:
          type: string
        hex:
          type: string
        usage:
          type: string
      required: [name, hex, usage]

    GenerateBrandResponse:
      type: object
      properties:
        brandName:
          type: string
        slogan:
          type: string
        tagline:
          type: string
        toneDescription:
          type: string
        brandVoice:
          type: string
        targetPersona:
          type: string
        colors:
          type: array
          items:
            $ref: "#/components/schemas/BrandColor"
        namingRationale:
          type: string
      required: [brandName, slogan, tagline, toneDescription, brandVoice, targetPersona, colors, namingRationale]

    SaveBrandBody:
      type: object
      properties:
        niche:
          type: string
        brandName:
          type: string
        slogan:
          type: string
        data:
          type: object
          description: Full brand identity JSON
      required: [niche, brandName, data]

    SavedBrand:
      type: object
      properties:
        id:
          type: integer
        niche:
          type: string
        brandName:
          type: string
        slogan:
          type: string
        data:
          type: object
        createdAt:
          type: string
          format: date-time
      required: [id, niche, brandName, data, createdAt]

    # ─── ASSETS ──────────────────────────────
    AssetTypeSummary:
      type: object
      properties:
        count:
          type: integer
        recent:
          type: array
          items:
            type: object
      required: [count, recent]

    AssetsResponse:
      type: object
      properties:
        ideas:
          $ref: "#/components/schemas/AssetTypeSummary"
        bundles:
          $ref: "#/components/schemas/AssetTypeSummary"
        scripts:
          $ref: "#/components/schemas/AssetTypeSummary"
        hooks:
          $ref: "#/components/schemas/AssetTypeSummary"
        brands:
          $ref: "#/components/schemas/AssetTypeSummary"
        totalAssets:
          type: integer
      required: [ideas, bundles, scripts, hooks, brands, totalAssets]

    # ─── ANALYTICS ───────────────────────────
    DashboardStats:
      type: object
      properties:
        totalIdeas:
          type: integer
        totalBundlesGenerated:
          type: integer
        totalScriptsGenerated:
          type: integer
        topNiches:
          type: array
          items:
            type: object
            properties:
              niche:
                type: string
              count:
                type: integer
            required: [niche, count]
      required: [totalIdeas, totalBundlesGenerated, totalScriptsGenerated, topNiches]

    GenerationDataPoint:
      type: object
      properties:
        date:
          type: string
        count:
          type: integer
      required: [date, count]

    TypeBreakdown:
      type: object
      properties:
        type:
          type: string
        count:
          type: integer
        percentage:
          type: number
      required: [type, count, percentage]

    AnalyticsResponse:
      type: object
      properties:
        period:
          type: string
        totalGenerations:
          type: integer
        generationsByType:
          type: array
          items:
            $ref: "#/components/schemas/TypeBreakdown"
        generationsByDay:
          type: array
          items:
            $ref: "#/components/schemas/GenerationDataPoint"
        topNiches:
          type: array
          items:
            type: object
            properties:
              niche:
                type: string
              count:
                type: integer
            required: [niche, count]
        savedAssets:
          type: object
          properties:
            ideas:
              type: integer
            bundles:
              type: integer
            scripts:
              type: integer
            hooks:
              type: integer
            brands:
              type: integer
          required: [ideas, bundles, scripts, hooks, brands]
      required: [period, totalGenerations, generationsByType, generationsByDay, topNiches, savedAssets]

    # ─── CAMPAIGNS ───────────────────────────
    CreateCampaignBody:
      type: object
      properties:
        name:
          type: string
        productTitle:
          type: string
        channels:
          type: array
          items:
            type: string
        content:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
            caption:
              type: string
            price:
              type: string
            ctaLink:
              type: string
        scheduledAt:
          type: string
          format: date-time
      required: [name]

    UpdateCampaignBody:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [draft, active, published, paused]
        productTitle:
          type: string
        channels:
          type: array
          items:
            type: string
        content:
          type: object
        scheduledAt:
          type: string
          format: date-time
        metrics:
          type: object

    Campaign:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        productTitle:
          type: string
        channels:
          type: array
          items:
            type: string
        content:
          type: object
        scheduledAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        metrics:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, status, createdAt, updatedAt]
